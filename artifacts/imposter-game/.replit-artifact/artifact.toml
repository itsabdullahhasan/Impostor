kind = "web"
previewPath = "/"
title = "Imposter Word Game"
version = "1.0.0"
id = "artifacts/imposter-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25922

[services.development]
run = "pnpm --filter @workspace/imposter-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/imposter-game", "run", "build" ]
publicDir = "artifacts/imposter-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25922"
BASE_PATH = "/"
